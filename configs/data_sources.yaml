series:
  consommation_ciment:
    description: "Consommation mensuelle de ciment"
    source: "APC / DEPF"
    unit: "tonnes (post-correction)"
    frequency: monthly
    publication_lag_days: 35
    transform: log_diff
    include_in_model: true
    standardize: false

  credits_equipement:
    description: "Encours de crédits d'équipement"
    source: "Bank Al-Maghrib"
    unit: "MDH"
    frequency: monthly
    publication_lag_days: 35
    transform: log_diff
    include_in_model: true
    standardize: false

  credits_immobilier:
    description: "Encours de crédits immobiliers"
    source: "Bank Al-Maghrib"
    unit: "MDH"
    frequency: monthly
    publication_lag_days: 35
    transform: log_diff
    include_in_model: true
    standardize: false

  va_construction:
    description: "Valeur ajoutée construction — cible transformée en croissance"
    source: "HCP"
    unit: "croissance log trimestrielle annuelle"
    frequency: quarterly
    publication_lag_days: 90
    transform: none
    quarterly_assignment: last_month_of_quarter
    include_in_model: true
    is_target: true
    standardize: false

  ipai:
    description: "Indice de Production des Activités Industrielles"
    source: "HCP"
    unit: "Indice base 100"
    frequency: quarterly
    publication_lag_days: 60
    transform: log_diff_4
    quarterly_assignment: last_month_of_quarter
    include_in_model: false
    standardize: false

  lafarge_index:
    description: "Indice LafargeHolcim Maroc"
    source: "Bourse de Casablanca"
    unit: "MAD/action"
    frequency: monthly
    publication_lag_days: 0
    transform: log_diff
    include_in_model: true
    standardize: false

  investissement_etat:
    description: "Investissement de l'État"
    source: "MEF / TGR"
    unit: "MDH"
    frequency: monthly
    publication_lag_days: 20
    transform: diff
    include_in_model: false
    standardize: false

  creation_emploi:
    description: "Créations nettes d'emplois BTP"
    source: "HCP"
    unit: "Nombre"
    frequency: quarterly
    publication_lag_days: 90
    transform: diff
    quarterly_assignment: last_month_of_quarter
    include_in_model: false
    standardize: false