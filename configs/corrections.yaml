# Data correction parameters.
# All corrections are applied in src/lamiaty/data/corrections.py
# Values here drive the correction functions — no magic numbers in code.

cement_break:
  break_date: "2022-04-01"
  correction_factor: 759          # PLACEHOLDER — multiply pre-break values by this factor
  direction: multiply_pre_break   # values BEFORE break_date are scaled up
  status: PLACEHOLDER             # Change to CONFIRMED once validated with APC
  confirmed_by: null              # Set to "APC" or analyst name when confirmed
  # NOTE: At runtime, corrections.py emits a UserWarning if confirmed_by is null.
  # The pipeline still runs, but output should not be treated as production-ready.
  notes: >
    Rupture structurelle détectée en avril 2022 avec facteur multiplicatif ~759.
    Hypothèse : passage d'unités milliers de tonnes → tonnes, ou changement de
    périmètre APC. Contacter APC pour documentation officielle avant validation.

investissement_etat:
  treatment: ytd_to_monthly_flow
  # ytd_to_monthly_flow:
  #   Convertit une série cumulée (YTD) en flux mensuels cohérents :
  #   - Janvier = valeur de janvier
  #   - Mois t = cumul_t - cumul_{t-1} dans la même année
  #   → évite les ruptures artificielles entre décembre et janvier

  confirmed_by: null

  notes: >
    La série présente des valeurs fortement négatives en janvier,
    indiquant très probablement une structure en cumul annuel (YTD)
    qui se réinitialise en début d'année.

    La transformation ytd_to_monthly_flow est appliquée pour convertir
    cette série en flux mensuels économiquement cohérents.

    Contrairement à monthly_diff, cette méthode évite les biais liés à la
    différence entre décembre (année t-1) et janvier (année t).

    Cette transformation est retenue comme hypothèse de travail en attendant
    validation officielle par la TGR ou le MEF.

lafarge_string_fix:
  strip_commas: true              # Remove thousands separator commas ("1,612" → 1612.0)
  cast_to_float: true
